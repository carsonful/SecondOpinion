sonar.projectKey=carsonful_SecondOpinion
sonar.organization=carsonful


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=SecondOpinion
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Backend tests are test code, not source that needs coverage
sonar.sources=.
sonar.exclusions=backend/tests/**
sonar.tests=backend/tests

# Coverage report written by pytest-cov in the Build workflow
sonar.python.version=3.14
sonar.python.coverage.reportPaths=backend/coverage.xml
