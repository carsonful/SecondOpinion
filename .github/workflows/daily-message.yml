name: Daily GroupMe Message

on:
  workflow_dispatch:        # allows manual trigger for testing

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Gather project status and post to GroupMe
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectOwner = 'carsonful';
            const projectNumber = 4;

            // the real @mentions in the footer prompt.
            const GITHUB_TO_GROUPME_NAME = {
              carsonful: 'Carson Fulmer',
              njnereed: 'NJ',
              scrublad: 'Joey Patriarca',
              ishanrk: 'Ishan Kumthekar',
              
              // teammateLogin: 'Their GroupMe Name',
            };

            // labels exactly. Backlog is intentionally excluded.
            const STATUS_SECTIONS = [
              { key: 'Todo', label: '🟡 TO DO' },
              { key: 'In progress', label: '🔵 IN PROGRESS' },
              { key: 'In Review', label: '🟣 IN REVIEW' },
              { key: 'Done', label: '🟢 DONE' }
            ];

            const GROUPME_BOT_ID = process.env.GROUPME_BOT_ID;
            const GROUPME_ACCESS_TOKEN = process.env.GROUPME_ACCESS_TOKEN;
            const MAX_LEN = 950; // stay safely under GroupMe's 1000-char cap



            // find the group to post the msg to
            async function getGroupMembers() {
              const botsRes = await fetch(`https://api.groupme.com/v3/bots?token=${GROUPME_ACCESS_TOKEN}`);
              const botsJson = await botsRes.json();
              const bot = (botsJson.response || []).find(b => b.bot_id === GROUPME_BOT_ID);
              if (!bot) return {};

              const groupRes = await fetch(`https://api.groupme.com/v3/groups/${bot.group_id}?token=${GROUPME_ACCESS_TOKEN}`);
              const groupJson = await groupRes.json();
              const members = groupJson.response?.members || [];

              const nameToId = {};
              for (const m of members) nameToId[m.nickname] = m.user_id;
              return nameToId;
            }

            // get the project items

            const query = `
              query($login: String!, $number: Int!) {
                user(login: $login) {
                  projectV2(number: $number) {
                    items(first: 100) {
                      nodes {
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                        content {
                          ... on Issue { title number assignees(first: 5) { nodes { login } } }
                          ... on PullRequest { title number assignees(first: 5) { nodes { login } } }
                          ... on DraftIssue { title }
                        }
                      }
                    }
                  }
                }
              }
            `;
            const result = await github.graphql(query, { login: projectOwner, number: projectNumber });
            const items = result.user.projectV2.items.nodes;

            const nameToId = await getGroupMembers();

            //formatting - done with AI

            
            function formatAssignees(logins) {
              if (!logins || logins.length === 0) return 'Unassigned';
              return logins.join(', ');
            }

            function makeItemBlock(title, number, logins) {
              const prefix = number ? `#${number}` : '•';
              return { text: `${prefix}  ${title}\n      ↳ ${formatAssignees(logins)}`, mentions: [] };
            }

            const blocks = [];
            const allAssignedLogins = new Set();

            const today = new Date().toLocaleDateString('en-US', {
              weekday: 'long', month: 'short', day: 'numeric'
            });
            blocks.push({ text: `📋 ${today}`, mentions: [] });

            for (const section of STATUS_SECTIONS) {
              const sectionItems = items.filter(i => i.fieldValueByName?.name === section.key);
              blocks.push({ text: `${section.label} (${sectionItems.length})`, mentions: [], section: true });
              if (sectionItems.length === 0) {
                blocks.push({ text: '   None', mentions: [] });
              } else {
                sectionItems.forEach(i => {
                  const title = i.content?.title ?? 'Untitled';
                  const number = i.content?.number;
                  const logins = (i.content?.assignees?.nodes || []).map(a => a.login);
                  logins.forEach(l => allAssignedLogins.add(l));
                  blocks.push(makeItemBlock(title, number, logins));
                });
              }
            }

            // ---------- Footer: one real @mention per unique assignee ----------

            if (allAssignedLogins.size > 0) {
              let footerText = '';
              const footerMentions = [];
              [...allAssignedLogins].forEach((login, idx) => {
                if (idx > 0) footerText += ' ';
                const groupmeName = GITHUB_TO_GROUPME_NAME[login];
                const userId = groupmeName ? nameToId[groupmeName] : undefined;
                const token = `@${groupmeName || login}`;
                if (userId) footerMentions.push({ start: footerText.length, length: token.length, userId });
                footerText += token;
              });
              footerText += ' — what are you working on today?';
              blocks.push({ text: footerText, mentions: footerMentions, section: true });
            }

            // ---------- Pack blocks into messages under MAX_LEN ----------

            const messages = [];
            let curText = '';
            let curMentions = [];

            function flush() {
              if (curText.length > 0) {
                messages.push({ text: curText, mentions: curMentions });
              }
              curText = '';
              curMentions = [];
            }

            for (const block of blocks) {
              const sep = curText.length === 0 ? '' : (block.section ? '\n\n' : '\n');
              const addition = sep + block.text;
              if (curText.length + addition.length > MAX_LEN && curText.length > 0) {
                flush();
                curMentions = block.mentions.map(m => ({ ...m }));
                curText = block.text;
              } else {
                curMentions.push(...block.mentions.map(m => ({ ...m, start: m.start + curText.length + sep.length })));
                curText += addition;
              }
            }
            flush();

            // ---------- Post each message in order, small delay to preserve ordering ----------

            for (let i = 0; i < messages.length; i++) {
              const msg = messages[i];
              const body = { bot_id: GROUPME_BOT_ID, text: msg.text };
              if (msg.mentions.length > 0) {
                body.attachments = [{
                  type: 'mentions',
                  user_ids: msg.mentions.map(m => m.userId),
                  loci: msg.mentions.map(m => [m.start, m.length])
                }];
              }
              await fetch('https://api.groupme.com/v3/bots/post', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
              });
              if (i < messages.length - 1) {
                await new Promise(resolve => setTimeout(resolve, 800));
              }
            }
        env:
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          GROUPME_ACCESS_TOKEN: ${{ secrets.GROUPME_ACCESS_TOKEN }}
