# Include this file inside Nginx's http block, usually via conf.d/*.conf.
# Replace secondopinion.example, the certificate paths, and the dist root.
# This recipe terminates TLS directly at Nginx, with one local Uvicorn worker.
map $scheme $secondopinion_hsts {
    default "";
    https "max-age=31536000";
}

map $uri $secondopinion_csp {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'";
    ~^/api(?:/|$) "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    /openapi.json "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    # FastAPI's interactive documentation uses its own CDN assets.
    ~^/docs(?:/|$) "";
    /redoc "";
}

# Avoid recording search queries in access logs.
log_format secondopinion '$remote_addr $request_method $uri $status';

server {
    listen 80;
    server_name secondopinion.example;
    access_log /var/log/nginx/secondopinion.access.log secondopinion;
    include /etc/nginx/secondopinion/headers.conf;
    # Use the configured origin rather than reflecting an arbitrary Host value.
    return 308 https://secondopinion.example$request_uri;
}

server {
    listen 443 ssl;
    server_name secondopinion.example;
    ssl_certificate /etc/ssl/secondopinion/fullchain.pem;
    ssl_certificate_key /etc/ssl/secondopinion/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/secondopinion/frontend/dist;
    index index.html;
    access_log /var/log/nginx/secondopinion.access.log secondopinion;
    include /etc/nginx/secondopinion/headers.conf;

    location = /api {
        include /etc/nginx/secondopinion/proxy.conf;
    }
    location ^~ /api/ {
        include /etc/nginx/secondopinion/proxy.conf;
    }
    location ~ ^/(?:docs(?:/.*)?|redoc|openapi\.json)$ {
        include /etc/nginx/secondopinion/proxy.conf;
    }
    # Only application routes receive the SPA entry point. A missing script,
    # font, or API path must keep its real error response, never index.html.
    location ~ ^/(?:about|how-it-works)/?$ {
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    # Hidden files cannot become public through a mistaken deployment copy.
    location ~ /\. {
        deny all;
    }
}
