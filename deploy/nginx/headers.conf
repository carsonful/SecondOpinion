# Included at server scope. Keep location blocks free of add_header directives:
# adding even one there would discard these inherited headers on older Nginx.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy $secondopinion_csp always;
add_header Strict-Transport-Security $secondopinion_hsts always;

# The edge owns the policies, including errors generated before the API answers.
# Avoid two CSPs being combined into an unexpectedly restrictive policy.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
