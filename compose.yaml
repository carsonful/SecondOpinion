services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: secondopinion
      POSTGRES_PASSWORD: secondopinion
      POSTGRES_DB: secondopinion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondopinion -d secondopinion"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
