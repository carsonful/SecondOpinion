services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secondopinion
      POSTGRES_USER: secondopinion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secondopinion}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondopinion -d secondopinion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
